name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Build and checks
        run: |
          swift build -c release
          swift run PomodoroChecks

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          plutil -replace CFBundleShortVersionString -string "$VERSION" Resources/Info.plist
          plutil -replace CFBundleVersion -string "$VERSION" Resources/Info.plist

      - name: Assemble app bundle
        run: ./Scripts/make_app.sh release

      - name: Zip app bundle
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ditto -c -k --sequesterRsrc --keepParent build/Pomodoro.app "Pomodoro-${VERSION}.zip"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > release-notes.md <<EOF
          ## Install

          1. Download Pomodoro-${VERSION}.zip below and unzip it.
          2. Move Pomodoro.app into /Applications.
          3. On first launch, right-click the app and choose Open, or run \`xattr -cr /Applications/Pomodoro.app\` in Terminal. The build is ad-hoc signed and not notarized, so Gatekeeper will ask once.

          Requires macOS 26 or later.
          EOF
          gh release create "$GITHUB_REF_NAME" "Pomodoro-${VERSION}.zip" \
            --title "Pomodoro $VERSION" \
            --notes-file release-notes.md \
            --generate-notes
